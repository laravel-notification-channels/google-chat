name: Check & fix styling

on: [push]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php-cs-fixer:
    name: PHP CS Fixer
    runs-on: ubuntu-latest
    permissions:
      contents: write # needed to push the style-fix commit back to the branch

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.head_ref }}
          # git-auto-commit-action below needs to push using the credentials
          # actions/checkout persists here, so we intentionally keep them.
          persist-credentials: true # zizmor: ignore[artipacked]

      - name: Run PHP CS Fixer
        uses: docker://oskarstark/php-cs-fixer-ga@sha256:e1ecd59fdc0d097399955966d6b4c5e067be83c9bbea771f446dd3cfcdb53ee7 # 3.26.0
        with:
          args: --config=.php-cs-fixer.dist.php --allow-risky=yes

      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@b863ae1933cb653a53c021fe36dbb774e1fb9403 # v5
        with:
          commit_message: Fix styling
